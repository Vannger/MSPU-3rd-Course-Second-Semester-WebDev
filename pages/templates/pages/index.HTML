{% extends 'pages/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="bg-dark text-white px-4 py-5 text-center">
    <div class="py-5">
        <h1 class="display-5 fw-bold text-white">{{ title }}</h1>
        <div class="col-lg-6 mx-auto">
            <p class="fs-5 mb-4 text-secondary">{{ welcome_text }}</p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <button type="button" class="btn btn-primary btn-lg px-4 me-sm-3 fw-bold">Главная</button>
            </div>
        </div>
    </div>
</div> <div class="album py-5 bg-dark" data-bs-theme="dark">
    <div class="row row-cols-1 row-cols-md-3 g-4">
        
        <div class="col">
            <div class="card shadow-sm h-100">
                <svg class="bd-placeholder-img card-img-top" width="100%" height="225" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid slice"><rect width="100%" height="100%" fill="#333"/></svg>
                <div class="card-body">
                    <h5 class="card-title">Заголовок 1</h5>
                    <p class="card-text">Краткое описание карточки.</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <button type="button" class="btn btn-sm btn-outline-light">View</button>
                            <button type="button" class="btn btn-sm btn-outline-light">Edit</button>
                        </div>
                        <small class="text-body-secondary">9 mins</small>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
